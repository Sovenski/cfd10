[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cfd10"
version = "0.0.1"
description = "Learned-combiner market turn detector that distills to a Pine-portable ruleset"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "pyarrow",
    "numba",
    "scikit-learn",
    "lightgbm",
    "hydra-core",
    "omegaconf",
    "optuna",
    "scipy",
    "matplotlib",
    "tqdm",
]

[project.optional-dependencies]
dev = ["torch", "pytest", "ruff", "mypy"]

[tool.hatch.build.targets.wheel]
packages = ["src/cfd10"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
